<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="eco-sky" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b0c0a"/>
      <stop offset="1" stop-color="#141c12"/>
    </linearGradient>
    <linearGradient id="eco-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c6e05c"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
    <radialGradient id="eco-glow" cx="72%" cy="42%" r="42%">
      <stop stop-color="#365314" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0b0c0a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#eco-sky)"/>
  <rect width="800" height="450" fill="url(#eco-glow)"/>

  <!-- stacked modular blocks -->
  <g transform="translate(430, 78)">
    <rect x="88" y="0" width="196" height="78" rx="10" fill="#1b1e18" stroke="#3f6212" stroke-width="1.5"/>
    <rect x="104" y="18" width="72" height="8" rx="4" fill="#c6e05c" opacity="0.85"/>
    <rect x="104" y="36" width="48" height="6" rx="3" fill="#9a9d93" opacity="0.7"/>
    <rect x="248" y="18" width="18" height="18" rx="3" fill="#c6e05c" opacity="0.35"/>

    <rect x="0" y="96" width="168" height="86" rx="10" fill="#141613" stroke="#4d7c0f" stroke-width="1.5"/>
    <rect x="16" y="114" width="88" height="8" rx="4" fill="#eceae3" opacity="0.7"/>
    <rect x="16" y="132" width="56" height="6" rx="3" fill="#9a9d93" opacity="0.6"/>
    <rect x="16" y="154" width="40" height="10" rx="5" fill="#c6e05c"/>

    <rect x="180" y="96" width="196" height="86" rx="10" fill="#052e16" stroke="#c6e05c" stroke-width="1.75"/>
    <rect x="198" y="114" width="96" height="9" rx="4" fill="#ecfccb"/>
    <rect x="198" y="132" width="70" height="7" rx="3" fill="#86efac" opacity="0.75"/>
    <g transform="translate(198, 154)">
      <rect width="22" height="14" rx="2" fill="#4ade80" opacity="0.9"/>
      <rect x="28" width="22" height="14" rx="2" fill="#22c55e" opacity="0.7"/>
      <rect x="56" width="22" height="14" rx="2" fill="#166534" opacity="0.9"/>
    </g>

    <rect x="48" y="198" width="220" height="78" rx="10" fill="#1b1e18" stroke="#365314" stroke-width="1.5"/>
    <rect x="64" y="216" width="80" height="8" rx="4" fill="#a3a3a3" opacity="0.55"/>
    <rect x="64" y="234" width="52" height="6" rx="3" fill="#737373" opacity="0.6"/>
    <rect x="200" y="220" width="48" height="34" rx="6" fill="#14532d"/>
  </g>

  <text x="48" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#eceae3">Ecosystem of blocks.</text>
  <text x="48" y="146" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#eceae3">AI/HPC, modular.</text>
  <rect x="48" y="186" width="148" height="34" rx="4" fill="#c6e05c"/>
  <text x="122" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0b0c0a">Visit ECOBLOX</text>
  <rect x="208" y="186" width="118" height="34" rx="4" fill="none" stroke="#c6e05c" stroke-width="1.5"/>
  <text x="267" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#c6e05c">MDC solutions</text>

  <text x="400" y="424" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#c6e05c">ecoblox.com</text>
</svg>
